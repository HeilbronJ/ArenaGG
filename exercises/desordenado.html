<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="encabezado-sitio">
      <h1>Tienda de la Esquina</h1>
      <p class="lema">Los mejores precios del barrio</p>
    </header>
    <main class="contenido-principal">
      <section>
        <h2>Productos</h2>
        <div class="tarjeta-producto">
          <img src="agua.jpg" alt="Botella de agua de 600 ml">
          <h3 class="nombre-producto">Agua 600 ml</h3>
          <p class="precio">$2.000</p>
          <button class="boton-agregar">Agregar</button>
        </div>
        <div class="tarjeta-producto">
          <img src="papas.jpg" alt="Bolsa de papas fritas">
          <h3 class="nombre-producto">Papas fritas</h3>
          <p class="precio">$3.200</p>
          <button class="boton-agregar">Agregar</button>
        </div>
      </section>
    </main>
    <footer class="pie-sitio">
      <p>Tienda de la Esquina · Barranquilla</p>
    </footer>
  </body>
</html>
